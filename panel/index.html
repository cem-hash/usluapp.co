<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Uslu Panel</title>
<link rel="icon" href="../assets/ikon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FAF8F3; --card: #FFFFFF; --ink: #151515; --muted: #6F6F73; --line: #ECE8DF;
  --accent: #FFE3A2; --accent-ink: #5A4300; --good: #2E9E5B; --bad: #D9534F; --bar: #151515; --bar-soft: #E8E2D4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --card: #1E1E1C; --ink: #F3F1EC; --muted: #A3A19B; --line: #2E2D2A;
    --accent: #FFE3A2; --accent-ink: #5A4300; --bar: #F3F1EC; --bar-soft: #3A3934;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Geist, system-ui, sans-serif; }
.wrap { max-width: 1360px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.logo { font: 32px/1 Pacifico, cursive; }
.logo small { font: 500 13px Geist, sans-serif; color: var(--muted); margin-left: 8px; }
h2 { font: 400 30px/1.1 "Instrument Serif", serif; margin: 34px 0 12px; }
.muted { color: var(--muted); }
button, select, input { font: inherit; color: inherit; }
.btn { background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 600; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.ranges { display: flex; gap: 6px; flex-wrap: wrap; }
.ranges button { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.ranges button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.kpi .v { font: 600 clamp(22px, 2.2vw, 30px)/1.1 Geist, sans-serif; margin-top: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 13px; color: var(--muted); margin-top: 4px; }
.kpi > .muted:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi.hl { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.kpi.hl .s { color: var(--accent-ink); opacity: .8; }
.two { display: grid; gap: 12px; grid-template-columns: 1.4fr 1fr; }
@media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
.funnel .row { display: grid; grid-template-columns: 150px 1fr 48px 96px; gap: 10px; align-items: center; padding: 5px 0; font-size: 14px; }
.funnel .track { background: var(--bar-soft); border-radius: 6px; height: 14px; overflow: hidden; }
.funnel .fill { background: var(--bar); height: 100%; border-radius: 6px; }
.funnel .drop { color: var(--bad); font-size: 12px; text-align: right; white-space: nowrap; }
.funnel .ok { color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; }
.funnel .head { color: var(--muted); font-size: 12px; }
@media (max-width: 560px) { .funnel .row { grid-template-columns: 96px 1fr 48px; } .funnel .drop { display: none; } }
.list .item { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.list .item:last-child { border-bottom: 0; }
.days { display: flex; align-items: flex-end; gap: 4px; height: 140px; padding-top: 8px; overflow-x: auto; }
.day { flex: 1 0 18px; position: relative; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; padding-bottom: 16px; }
.day .b { width: 100%; border-radius: 4px 4px 0 0; }
.day .b.paid { position: absolute; bottom: 16px; left: 0; }
.day .lbl { position: absolute; bottom: 0; }
.day .lbl { font-size: 10px; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; font-variant-numeric: tabular-nums; }
td .muted { white-space: nowrap; }
.funnel .sub { margin: 14px 0 4px; font-size: 12px; color: var(--muted); }
tr.u { cursor: pointer; }
tr.u:hover td { background: color-mix(in srgb, var(--accent) 25%, transparent); }
.scroll { overflow-x: auto; }
.avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: var(--accent); display: inline-grid; place-items: center; font-weight: 600; color: var(--accent-ink); }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--bar-soft); white-space: nowrap; }
.pill.good { background: #DDF3E5; color: #1E6B3E; }
.push .row { display: grid; grid-template-columns: 70px 1fr; gap: 10px; align-items: start; margin-bottom: 10px; }
.push .row label { color: var(--muted); font-size: 13px; padding-top: 10px; }
.push input, .push select, .push textarea { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font: inherit; color: inherit; }
.pill.warn { background: var(--accent); color: var(--accent-ink); }
.pill.bad { background: #F8DEDD; color: #8E2E2B; }
.login { max-width: 420px; margin: 12vh auto; }
.login input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); margin: 12px 0; }
.drawer { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 10; }
.drawer.open { display: block; }
.drawer .panel { position: absolute; right: 0; top: 0; bottom: 0; width: min(520px, 100%); background: var(--bg); padding: 20px 16px; overflow-y: auto; }
.tl { list-style: none; padding: 0; margin: 12px 0; }
.tl li { display: grid; grid-template-columns: 70px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.tl .t { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.big-photo { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; }
.err { color: var(--bad); }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://golwjhezedbrcxwxwsqq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_udiXhEZeW3vEelTWH8XF6Q_Pkcq_LlG';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');
let range = localGet('range') || '7';

const STEP = {
  welcome: 'Karşılama', name: 'İsim', photo: 'Fotoğraf', age: 'Yaş', insightAge: 'Bilgi: yaş', breed: 'Irk',
  origin: 'Nereden geldi', arrival: 'Ne zaman geldi', home: 'Ev', household: 'Hane', problems: 'Sorunlar',

  goal: 'Hedef', minutes: 'Günlük süre', insightShort: 'Bilgi: kısa dersler', routine: 'Rutin', rewards: 'Ödüller',
  microchip: 'Mikroçip', ownerName: 'Sahip: ad', ownerPhoto: 'Sahip: fotoğraf', ownerGender: 'Sahip: cinsiyet', ownerAge: 'Sahip: yaş', ownerIncome: 'Sahip: gelir', ownerBudget: 'Sahip: köpek bütçesi', meals: 'Öğün saatleri', outings: 'Dışarı çıkış saatleri', insightOwner: 'Bilgi: sahip', inviteCode: 'Davet kodu', building: 'Plan hazırlanıyor', story: 'Hikâye',
  summary: 'Plan özeti', notifications: 'Bildirim izni'
};
const SURVEY = { fiyat: 'Fiyat yüksek', deneme: 'Önce denemek istiyor', emin_degil: 'Emin değil', sonra: 'Sonra alacak', diger: 'Başka sebep', gecti: 'Cevap vermedi' };
const RESULT = { success: 'tamamlandı', cancelled: 'vazgeçti', pending: 'onay bekliyor', failed: 'hata' };
const AGE = { puppy0to4: 'Yavru (0-4 ay)', puppy4to6: 'Yavru (4-6 ay)', adolescent: 'Ergen', adult: 'Yetişkin', senior: 'Yaşlı',
  puppy_0_4m: 'Yavru (0-4 ay)', puppy_4_6m: 'Yavru (4-6 ay)', adolescent_6_18m: 'Ergen (6-18 ay)', adult_18m_7y: 'Yetişkin', senior_7y: 'Yaşlı' };
const ageLabel = a => AGE[a] || (/^puppy/.test(a || '') ? 'Yavru' : /^adolescent/.test(a || '') ? 'Ergen' : /^adult/.test(a || '') ? 'Yetişkin' : /^senior/.test(a || '') ? 'Yaşlı' : (a || ''));

function localGet(k) { try { return localStorage.getItem('uslu-panel-' + k); } catch { return null; } }
function localSet(k, v) { try { localStorage.setItem('uslu-panel-' + k, v); } catch {} }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function pct(a, b) { return b ? Math.round(a * 100 / b) + '%' : '–'; }
function fmtDate(d) { return new Date(d).toLocaleString('tr-TR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); }
function fmtTime(d) { return new Date(d).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
function bounds() {
  const to = new Date(Date.now() + 60_000);
  const from = range === 'all' ? new Date('2026-01-01') : range === '1' ? new Date(new Date().setHours(0, 0, 0, 0)) : new Date(Date.now() - Number(range) * 86400_000);
  return { p_from: from.toISOString(), p_to: to.toISOString() };
}


async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderLogin();
  renderShell(session.user.email);
  load();
}

function renderLogin(msg = '') {
  app.innerHTML = `<div class="login card">
    <div class="logo">Uslu <small>panel</small></div>
    <p class="muted">Yönetici e-postanı yaz, sana bir giriş bağlantısı gönderelim.</p>
    <input id="email" type="email" placeholder="ornek@protrom.com" autocomplete="email">
    <button class="btn" id="send">Giriş bağlantısı gönder</button>
    <p id="msg" class="muted">${esc(msg)}</p></div>`;
  document.getElementById('send').onclick = async () => {
    const email = document.getElementById('email').value.trim();
    if (!email) return;
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
    document.getElementById('msg').textContent = error ? 'Gönderilemedi: ' + error.message : 'Bağlantı gönderildi. E-postanı kontrol et.';
  };
}

function renderShell(email) {
  const opts = [['1', 'Bugün'], ['7', '7 gün'], ['30', '30 gün'], ['90', '90 gün'], ['all', 'Tümü']];
  app.innerHTML = `<header>
      <div class="logo">Uslu <small>panel</small></div>
      <div class="ranges">${opts.map(([v, l]) => `<button data-r="${v}" class="${v === range ? 'on' : ''}">${l}</button>`).join('')}</div>
      <div><span class="muted" style="font-size:13px">${esc(email)}</span> <button class="btn ghost" id="out">Çıkış</button></div>
    </header>
    <div id="body"><p class="muted">Veriler yükleniyor…</p></div>`;
  app.querySelectorAll('.ranges button').forEach(b => b.onclick = () => { range = b.dataset.r; localSet('range', range); renderShell(email); load(); });
  document.getElementById('out').onclick = async () => { await sb.auth.signOut(); renderLogin(); };
}

async function rpc(name, args) {
  const { data, error } = await sb.rpc(name, args);
  if (error) throw new Error(error.message === 'not allowed' ? 'Bu e-posta panel yöneticisi değil.' : error.message);
  return data;
}

async function load() {
  const body = document.getElementById('body');
  const b = bounds();
  try {
    const [o, daily, users, usage, obEv] = await Promise.all([
      rpc('panel_overview', b), rpc('panel_daily', b), rpc('panel_users', { ...b, p_limit: 300 }), usageEvents(b), obEvents(b)
    ]);
    const ob = onboarding(obEv);
    o.onboarding_started = ob.started; o.onboarding_done = ob.done;
    const drop = ob.drop;
    const invites = await inviteEvents();
    // Uslu is free since 1.2.0: the panel shows usage only
    body.innerHTML = liveView(await todayEvents(), users) + summaryView(insights(usage, o, drop)) + pushView(users, usage) + usageKpis(usage) + retentionKpis(users, usage) + featureKpis(usage) + onboardingKpis(o)
      + `<div class="two"><div>${funnelView(ob)}</div><div>${dropView(drop, ob)}</div></div>`
      + usersView(users, usage, invites) + inviteView(users, usage, invites) + feedbackView(usage)
      + `<div class="two"><div>${hoursView(usage, 'walk')}</div><div>${hoursView(usage, 'notif')}</div></div>`
      + ownersView(usage) + dailyView(daily);
    bindSummary();
    bindPush();
    startLive(users);
    await fillPhotos(users);
    body.querySelectorAll('tr.u').forEach(tr => tr.onclick = () => openUser(users.find(u => u.install_id === tr.dataset.id)));
  } catch (e) {
    body.innerHTML = `<p class="err">${esc(e.message)}</p>`;
  }
}

// Usage since Uslu went free (1.2.0): opens, owner profiles, suggestions, health log entries and opened reminders.
// Admins can read the events table directly, so these need no panel_* function.
const USAGE = ['app_open', 'app_active', 'owner_profile', 'owner_photo', 'feedback', 'health_log', 'notif_open', 'dog_profile', 'consent', 'push_token', 'ping', 'session_end', 'tab_view', 'assistant_message', 'widget_state', 'satisfaction'];
const GENDER = { female: 'Kadın', male: 'Erkek', skip: '–' };
const INCOME = { '<25k': '< 25 bin', '25-50k': '25–50 bin', '50-100k': '50–100 bin', '100k+': '100 bin +', skip: '–' };
const BUDGET = { '<1000': '< 1.000', '1000-2500': '1.000–2.500', '2500-5000': '2.500–5.000', '5000+': '5.000 +' };
const LOG = { walk: 'Yürüyüş', potty_out: 'Dışarıya tuvalet', potty_in: 'Eve tuvalet', food: 'Mama', weight: 'Kilo', symptom: 'Belirti' };



async function usageEvents(b) {
  const all = [];
  for (let from = 0; from < 20000; from += 1000) {
    const { data, error } = await sb.from('events').select('install_id,name,props,created_at,device')
      .in('name', USAGE).gte('created_at', b.p_from).lt('created_at', b.p_to)
      .order('created_at', { ascending: false }).range(from, from + 999);
    if (error) throw new Error(error.message);
    all.push(...data);
    if (data.length < 1000) break;
  }
  return all;
}

// Phone model identifiers (sent since 1.2.0) to names; builds before 1.2.0 sent only "iphone" or "ipad".
const PHONES = { 'iPhone10,1': '8', 'iPhone10,4': '8', 'iPhone10,2': '8 Plus', 'iPhone10,5': '8 Plus', 'iPhone10,3': 'X', 'iPhone10,6': 'X',
  'iPhone11,2': 'XS', 'iPhone11,4': 'XS Max', 'iPhone11,6': 'XS Max', 'iPhone11,8': 'XR', 'iPhone12,1': '11', 'iPhone12,3': '11 Pro',
  'iPhone12,5': '11 Pro Max', 'iPhone12,8': 'SE (2. nesil)', 'iPhone13,1': '12 mini', 'iPhone13,2': '12', 'iPhone13,3': '12 Pro',
  'iPhone13,4': '12 Pro Max', 'iPhone14,4': '13 mini', 'iPhone14,5': '13', 'iPhone14,2': '13 Pro', 'iPhone14,3': '13 Pro Max',
  'iPhone14,6': 'SE (3. nesil)', 'iPhone14,7': '14', 'iPhone14,8': '14 Plus', 'iPhone15,2': '14 Pro', 'iPhone15,3': '14 Pro Max',
  'iPhone15,4': '15', 'iPhone15,5': '15 Plus', 'iPhone16,1': '15 Pro', 'iPhone16,2': '15 Pro Max', 'iPhone17,3': '16', 'iPhone17,4': '16 Plus',
  'iPhone17,1': '16 Pro', 'iPhone17,2': '16 Pro Max', 'iPhone17,5': '16e', 'iPhone18,3': '17', 'iPhone18,1': '17 Pro', 'iPhone18,2': '17 Pro Max', 'iPhone18,4': 'Air' };
function phone(id) {
  if (!id) return '–';
  if (PHONES[id]) return 'iPhone ' + PHONES[id];
  if (id === 'iphone') return 'iPhone';
  if (id === 'ipad' || id.startsWith('iPad')) return 'iPad';
  return id;
}
function dur(sec) {
  sec = Math.round(sec || 0);
  if (!sec) return '–';
  if (sec < 60) return sec + ' sn';
  const m = Math.round(sec / 60);
  return m < 60 ? m + ' dk' : Math.floor(m / 60) + ' sa ' + (m % 60) + ' dk';
}

// Şu an ve bugün: today's opens, pings (every 2 minutes while Uslu is open) and visit lengths, independent of the range.
async function todayEvents() {
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const all = [];
  for (let from = 0; from < 20000; from += 1000) {
    const { data, error } = await sb.from('events').select('install_id,name,props,created_at,device')
      .in('name', ['app_open', 'app_active', 'ping', 'session_end']).gte('created_at', start.toISOString())
      .order('created_at', { ascending: false }).range(from, from + 999);
    if (error) throw new Error(error.message);
    all.push(...data);
    if (data.length < 1000) break;
  }
  return all;
}

function liveView(ev, users) {
  const last = {};
  for (const e of ev) if (!last[e.install_id]) last[e.install_id] = e; // newest first
  const now = Object.values(last).filter(e => e.name !== 'session_end' && Date.now() - new Date(e.created_at) < 3.5 * 60_000);
  const visitors = Object.keys(last).length;
  const ends = ev.filter(e => e.name === 'session_end').map(e => Number(e.props?.seconds || 0));
  const total = ends.reduce((a, b) => a + b, 0);
  const names = Object.fromEntries(users.map(u => [u.install_id, u.dog_name]));
  const models = {};
  for (const e of Object.values(last)) { const n = phone(e.device); models[n] = (models[n] || 0) + 1; }
  const top = Object.entries(models).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([n, c]) => `${esc(n)} (${c})`).join(', ');
  const k = (label, v, s, hl) => `<div class="card kpi${hl ? ' hl' : ''}"><div class="muted">${label}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  return `<div id="live"><h2>Şu an <span class="muted" style="font:500 14px Geist">her dakika yenilenir</span></h2><div class="grid">
    ${k('Şu an Uslu’da', now.length, now.length ? now.slice(0, 4).map(e => esc(names[e.install_id] || 'İsimsiz')).join(', ') : 'Şu an kimse yok', true)}
    ${k('Bugün giren', visitors, 'gece yarısından beri açan kişi')}
    ${k('Bugün geçirilen süre', dur(total), ends.length ? `ziyaret başına ortalama ${dur(total / ends.length)}` : 'henüz kapanan ziyaret yok')}
    ${k('Bugünkü telefonlar', Object.keys(models).length, top || '–')}
  </div></div>`;
}

let liveTimer = null;
function startLive(users) {
  clearInterval(liveTimer);
  liveTimer = setInterval(async () => {
    const el = document.getElementById('live');
    if (!el) return clearInterval(liveTimer);
    try { el.outerHTML = liveView(await todayEvents(), users); } catch { /* keep the last numbers */ }
  }, 60_000);
}

// Geri dönüş: of the people who finished onboarding in the range, how many opened Uslu again the next day,
// within 3 days and around day 7. Only people old enough to have had that day count, so new installs do not pull it down.
function retentionKpis(users, ev) {
  const dayMs = 86400_000, local = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x.getTime(); };
  const days = {};
  for (const e of ev) if (['app_open', 'app_active', 'ping'].includes(e.name)) (days[e.install_id] ||= new Set()).add(local(e.created_at));
  const done = users.filter(u => u.onboarding_done && u.first_seen);
  const rate = (from, to) => {
    const eligible = done.filter(u => Date.now() - local(u.first_seen) >= to * dayMs + dayMs);
    const back = eligible.filter(u => [...(days[u.install_id] || [])].some(d => { const n = Math.round((d - local(u.first_seen)) / dayMs); return n >= from && n <= to; }));
    return { n: eligible.length, back: back.length, pct: eligible.length ? Math.round(100 * back.length / eligible.length) : null };
  };
  const one = done.filter(u => (days[u.install_id]?.size || 0) <= 1 && Date.now() - local(u.first_seen) >= 2 * dayMs).length;
  const k = (label, r, s) => `<div class="card kpi${label === 'Ertesi gün' ? ' hl' : ''}"><div class="muted">${label}</div><div class="v">${r.pct === null ? '–' : '%' + r.pct}</div><div class="s">${r.n ? `${r.n} kişiden ${r.back} kişi. ${s}` : 'Henüz yeterli kullanıcı yok.'}</div></div>`;
  return `<h2>Geri dönüş <span class="muted" style="font:500 14px Geist">onboarding'i bitirenler, seçili aralık</span></h2><div class="grid">
    ${k('Ertesi gün', rate(1, 1), 'Ertesi gün tekrar açtı.')}
    ${k('İlk 3 gün', rate(1, 3), 'Sonraki 3 günde en az bir kez açtı.')}
    ${k('7. gün', rate(6, 8), '6–8. günler arasında açtı.')}
    <div class="card kpi"><div class="muted">Tek gün kalan</div><div class="v">${one}</div><div class="s">Sadece kurulum günü kullanan kişi.</div></div>
  </div>`;
}

// Özellikler: which tabs people open, the assistant, the home screen widget and the in-app rating (all since 1.2.2).
function featureKpis(ev) {
  const users = name => new Set(ev.filter(e => e.name === name).map(e => e.install_id));
  const tabs = { today: 'Bugün', plan: 'Plan', explore: 'Keşfet', health: 'Sağlık', assistant: 'Asistan' };
  const tabUsers = Object.fromEntries(Object.keys(tabs).map(t => [t, new Set(ev.filter(e => e.name === 'tab_view' && e.props?.tab === t).map(e => e.install_id)).size]));
  const anyTab = users('tab_view').size;
  const widgets = {};
  for (const e of ev) if (e.name === 'widget_state' && !(e.install_id in widgets)) widgets[e.install_id] = e.props?.kinds || 'none';
  const withWidget = Object.values(widgets).filter(k => k !== 'none').length;
  const scores = ev.filter(e => e.name === 'satisfaction').map(e => Number(e.props?.score)).filter(Boolean);
  const avg = scores.length ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1) : '–';
  const k = (label, v, s) => `<div class="card kpi"><div class="muted">${label}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  if (!anyTab && !scores.length && !Object.keys(widgets).length) return `<h2>Özellikler</h2><div class="card muted">Sekme, asistan, widget ve memnuniyet verisi 1.2.2 ile gelmeye başlayacak.</div>`;
  return `<h2>Özellikler <span class="muted" style="font:500 14px Geist">seçili aralık, kişi sayısı</span></h2><div class="grid">
    ${Object.entries(tabs).filter(([t]) => t !== 'today').map(([t, l]) => k(l, tabUsers[t], anyTab ? `${anyTab} kişiden, %${Math.round(100 * tabUsers[t] / anyTab)}` : '')).join('')}
    ${k('Asistana soru', ev.filter(e => e.name === 'assistant_message').length, users('assistant_message').size + ' kişi sordu')}
    ${k('Widget ekli', withWidget, Object.keys(widgets).length + ' kişiden')}
    ${k('Memnuniyet', avg === '–' ? avg : avg + ' / 5', scores.length + ' kişi puan verdi')}
  </div>`;
}

function usageKpis(ev) {
  const opens = ev.filter(e => e.name === 'app_open' || e.name === 'app_active');
  const since = ms => new Set(opens.filter(e => Date.now() - new Date(e.created_at) < ms).map(e => e.install_id)).size;
  const walks = ev.filter(e => e.name === 'health_log' && e.props?.type === 'walk');
  const k = (label, v, s) => `<div class="card kpi"><div class="muted">${label}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  return `<h2>Kullanım</h2><div class="grid">
    ${k('Son 24 saat', since(86400_000), 'bu sürede açan kişi')}
    ${k('Son 7 gün', since(7 * 86400_000), 'bu sürede açan kişi')}
    ${k('Seçili aralıkta aktif', new Set(opens.map(e => e.install_id)).size, opens.length + ' açılış')}
    ${k('Kayıt girilen', ev.filter(e => e.name === 'health_log').length, new Set(ev.filter(e => e.name === 'health_log').map(e => e.install_id)).size + ' kişi girdi · ' + walks.length + ' yürüyüş')}
    ${k('Açılan bildirim', ev.filter(e => e.name === 'notif_open').length, new Set(ev.filter(e => e.name === 'notif_open').map(e => e.install_id)).size + ' kişi')}
    ${(() => { const s = ev.filter(e => e.name === 'session_end').map(e => Number(e.props?.seconds || 0)); const t = s.reduce((a, b) => a + b, 0);
       return k('Uslu’da geçen süre', dur(t), s.length ? `${s.length} ziyaret, ortalama ${dur(t / s.length)}` : 'süre 1.2.0 ile ölçülüyor'); })()}
    ${k('Öneri', ev.filter(e => e.name === 'feedback').length, 'Ayarlar > Öneride bulun')}
    ${(() => { const seen = new Set(); const c = ev.filter(e => e.name === 'consent' && !seen.has(e.install_id) && seen.add(e.install_id));
       return k('KVKK onayı', c.length, c.filter(e => e.props?.profile === 'yes').length + ' kişi profil rızası verdi'); })()}
  </div>`;
}

function dogNames(ev) {
  const m = {};
  for (const e of ev) if (e.name === 'dog_profile' && !m[e.install_id]) m[e.install_id] = e.props?.name;
  return m;
}

function ownersView(ev) {
  const seen = new Set(), dogs = dogNames(ev);
  const rows = ev.filter(e => e.name === 'owner_profile' && !seen.has(e.install_id) && seen.add(e.install_id));
  if (!rows.length) return `<h2>Sahipler</h2><div class="card muted">Bu aralıkta sahip bilgisi yok.</div>`;
  const tr = rows.map(e => { const p = e.props || {};
    return `<tr><td><strong>${esc(p.owner_name || '–')}</strong></td><td>${esc(dogs[e.install_id] || '')}</td><td>${esc(GENDER[p.gender] || '–')}</td>
      <td>${esc(p.age || '–')}</td><td>${esc(INCOME[p.income] || '–')}</td><td>${esc(BUDGET[p.budget] || '–')}</td><td class="muted">${fmtDate(e.created_at)}</td></tr>`; }).join('');

// Davetler: "invite_share" from the home card (who sent, through which app), "invite_click" from usluapp.co/indir?d=CODE
// and "invite_redeem" when a new user types the code in onboarding. All time, not the selected range: invites are few
// and a link can be clicked long after it was sent. Codes starting with TEST are test rows.
async function inviteEvents() {
  const all = [];
  for (let from = 0; from < 20000; from += 1000) {
    const { data, error } = await sb.from('events').select('install_id,name,props,created_at')
      .in('name', ['invite_share', 'invite_click', 'invite_redeem'])
      .order('created_at', { ascending: false }).range(from, from + 999);
    if (error) throw new Error(error.message);
    all.push(...data.filter(e => !String(e.props?.code || '').startsWith('TEST')));
    if (data.length < 1000) break;
  }
  return all;
}

// per inviter: their code, sends (with apps), clicks and installs on their link
function inviteStats(invites) {
  const byCode = {}, byInstall = {};
  const get = code => byCode[code] || (byCode[code] = { code, install: null, sends: 0, opens: 0, clicks: 0, installs: 0, channels: {}, last: null });
  for (const e of invites) {
    const code = String(e.props?.code || '').toUpperCase();
    if (!code) continue;
    const x = get(code);
    if (e.name === 'invite_share') {
      x.install = x.install || e.install_id; byInstall[e.install_id] = x; x.opens++;
      if (e.props?.sent === 'yes') { x.sends++; const c = e.props?.channel || '?'; x.channels[c] = (x.channels[c] || 0) + 1; }
      if (!x.last || e.created_at > x.last) x.last = e.created_at;
    } else if (e.name === 'invite_click') x.clicks++;
    else if (e.name === 'invite_redeem') x.installs++;
  }
  return { byCode, byInstall };
}

function inviteCell(st) {
  if (!st) return '<span class="muted">–</span>';
  return `<span title="gönderim · tıklama · kurulum">${st.sends} · ${st.clicks} · ${st.installs}</span>`;
}

function inviteView(users, usage, invites) {
  const { byCode } = inviteStats(invites);
  const rows = Object.values(byCode).filter(x => x.install).sort((a, b) => (b.installs - a.installs) || (b.clicks - a.clicks) || (b.sends - a.sends));
  const act = activity(usage);
  const dog = Object.fromEntries(users.map(u => [u.install_id, u.dog_name]));
  const sum = k => Object.values(byCode).reduce((a, x) => a + x[k], 0);
  const k = (label, v, s) => `<div class="card kpi"><div class="muted">${label}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  const channels = {};
  for (const x of rows) for (const [c, n] of Object.entries(x.channels)) channels[c] = (channels[c] || 0) + n;
  const topCh = Object.entries(channels).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([c, n]) => `${esc(c)} (${n})`).join(', ');
  const unknown = Object.values(byCode).filter(x => !x.install && (x.clicks || x.installs)).length;
  const tr = rows.slice(0, 50).map(x => {
    const owner = act[x.install]?.owner?.owner_name;
    const ch = Object.entries(x.channels).sort((a, b) => b[1] - a[1]).map(([c, n]) => `${esc(c)} ${n}`).join(', ');
    return `<tr><td><strong>${esc(dog[x.install] || 'İsimsiz')}</strong><div class="muted" style="font-size:12px">${esc(owner || '')}</div></td>
      <td><span class="pill">${esc(x.code)}</span></td><td>${x.sends}<div class="muted" style="font-size:12px">${x.opens - x.sends ? (x.opens - x.sends) + ' kez vazgeçti' : ''}</div></td>
      <td class="muted">${ch || '–'}</td><td>${x.clicks}</td><td>${x.installs}</td><td class="muted">${ago(x.last)}</td></tr>`;
  }).join('');
  return `<h2>Davetler <span class="muted" style="font:500 14px Geist">tüm zamanlar · “Uslu'yu arkadaşına önermek ister misin?” kartı</span></h2>
    <div class="grid">
      ${k('Davet gönderen', rows.filter(x => x.sends).length, 'en az bir kez gönderen kişi')}
      ${k('Gönderilen davet', sum('sends'), topCh || 'henüz yok')}
      ${k('Bağlantı tıklaması', sum('clicks'), 'usluapp.co/indir?d=… açılışları')}
      ${k('Davetle gelen', sum('installs'), 'kurulumda davet kodu yazan' + (unknown ? `, ${unknown} kod eşleşmedi` : ''))}
    </div>
    ${rows.length ? `<div class="card scroll" style="margin-top:12px"><table><tr><th>Davet eden</th><th>Kod</th><th>Gönderim</th><th>Uygulama</th><th>Tıklama</th><th>Kurulum</th><th>Son davet</th></tr>${tr}</table></div>`
      : '<div class="card muted" style="margin-top:12px">Henüz davet gönderilmedi. Kart 1.2.1 ile ana sayfaya geliyor.</div>'}`;
}

      <div class="muted" style="font-size:12px;margin-top:4px">${esc(dogs[e.install_id] || 'İsimsiz')} · ${fmtDate(e.created_at)} · ${esc(e.install_id.slice(0, 8))}</div></div>`).join('');

// Which hours people walk their dogs, or open reminders.
function hoursView(ev, kind) {
  const rows = kind === 'walk' ? ev.filter(e => e.name === 'health_log' && e.props?.type === 'walk') : ev.filter(e => e.name === 'notif_open');
  const title = kind === 'walk' ? 'Yürüyüş saatleri' : 'Bildirim açılış saatleri';
  if (!rows.length) return `<h2>${title}</h2><div class="card muted">Henüz veri yok.</div>`;
  const by = Array(24).fill(0);
  rows.forEach(e => by[Number(e.props?.hour) || 0]++);
  const max = Math.max(1, ...by);
  const bars = by.map((n, h) => `<div class="day" title="${String(h).padStart(2, '0')}:00 · ${n}"><div class="b" style="height:${n * 100 / max}%;background:var(--bar-soft)"></div><div class="lbl">${h % 3 === 0 ? h : ''}</div></div>`).join('');
  const peak = by.indexOf(max);
  const note = `En yoğun saat ${HOUR(peak)}. Bu saatin payı %${Math.round(max * 100 / rows.length)}.`;
  return `<h2>${title}</h2><div class="card"><div class="days">${bars}</div><p class="muted" style="font-size:13px;margin:8px 0 0">${note}</p></div>`;
}

// The summary on top: plain sentences worked out from the same numbers as the sections below.
const HOUR = h => String(h).padStart(2, '0') + ':00';
function peakHour(rows) {
  if (!rows.length) return null;
  const by = Array(24).fill(0);
  rows.forEach(r => by[r]++);
  const h = by.indexOf(Math.max(...by));
  return { hour: h, share: Math.round(by[h] * 100 / rows.length) };
}
function mostCommon(values) {
  const c = {};
  values.filter(v => v && v !== 'skip').forEach(v => c[v] = (c[v] || 0) + 1);
  const top = Object.entries(c).sort((a, b) => b[1] - a[1])[0];
  return top ? { value: top[0], share: Math.round(top[1] * 100 / values.filter(v => v && v !== 'skip').length) } : null;
}

function insights(ev, o, drop) {
  const out = [];
  const opens = ev.filter(e => e.name === 'app_open' || e.name === 'app_active');
  const day = new Set(opens.filter(e => Date.now() - new Date(e.created_at) < 86400_000).map(e => e.install_id)).size;
  const week = new Set(opens.filter(e => Date.now() - new Date(e.created_at) < 7 * 86400_000).map(e => e.install_id)).size;
  if (week) out.push(`Son 7 günde <strong>${week} kişi</strong> Uslu'yu açtı. Son 24 saatte açan kişi sayısı <strong>${day}</strong>.`);
  const openPeak = peakHour(opens.map(e => new Date(e.created_at).getHours()));
  if (openPeak) out.push(`Uygulama en çok <strong>${HOUR(openPeak.hour)}</strong> civarında açılıyor. Bu saatin açılışlardaki payı %${openPeak.share}.`);
  const walks = ev.filter(e => e.name === 'health_log' && e.props?.type === 'walk');
  const walkPeak = peakHour(walks.map(e => Number(e.props?.hour) || 0));
  if (walkPeak) {
    const mins = walks.map(e => Number(e.props?.minutes)).filter(Boolean);
    const avg = mins.length ? Math.round(mins.reduce((a, b) => a + b, 0) / mins.length) : null;
    out.push(`Kullanıcılar köpeklerini en çok <strong>${HOUR(walkPeak.hour)}</strong> civarında yürüyüşe çıkarıyor. Bu saatin yürüyüşlerdeki payı %${walkPeak.share}.${avg ? ` Bir yürüyüş ortalama <strong>${avg} dakika</strong> sürüyor.` : ''}`);
  }
  const logs = ev.filter(e => e.name === 'health_log');
  const logTop = mostCommon(logs.map(e => e.props?.type));
  if (logTop) out.push(`En sık girilen kayıt <strong>${esc((LOG[logTop.value] || logTop.value).toLowerCase())}</strong>, payı %${logTop.share}. Ana ekran widget'ından girilen kayıtların payı %${Math.round(logs.filter(e => e.props?.source === 'widget').length * 100 / logs.length)}.`);
  const notifPeak = peakHour(ev.filter(e => e.name === 'notif_open').map(e => Number(e.props?.hour) || 0));
  if (notifPeak) out.push(`Bildirimlere en çok <strong>${HOUR(notifPeak.hour)}</strong> civarında dokunuluyor. Toplu bildirimleri bu saatte göndermek daha iyi sonuç verir.`);
  if (o && o.onboarding_started) {
    let line = `Onboarding'i bitirme oranı <strong>%${Math.round(o.onboarding_done * 100 / o.onboarding_started)}</strong>.`;
    if (drop && drop.length) line += ` Kullanıcılar en çok <strong>${esc(STEP[drop[0].step] || drop[0].step)}</strong> adımında bırakıyor; bu adımda bırakan kişi sayısı ${drop[0].installs}.`;
    out.push(line);
  }
  const owners = ev.filter(e => e.name === 'owner_profile').map(e => e.props || {});
  if (owners.length) {
    const age = mostCommon(owners.map(p => p.age)), budget = mostCommon(owners.map(p => p.budget)), gender = mostCommon(owners.map(p => p.gender));
    const parts = [];
    if (age) parts.push(`En kalabalık yaş grubu <strong>${esc(age.value)}</strong>, payı %${age.share}.`);
    if (gender) parts.push(`En çok görülen cinsiyet <strong>${esc((GENDER[gender.value] || '').toLowerCase())}</strong>, payı %${gender.share}.`);
    if (budget) parts.push(`En sık köpek bütçesi ayda <strong>${esc(BUDGET[budget.value])} TL</strong>.`);
    if (parts.length) out.push(`Kendi bilgisini paylaşan sahip sayısı ${owners.length}. ${parts.join(' ')}`);
  }
  const fb = ev.filter(e => e.name === 'feedback');
  if (fb.length) out.push(`<strong>${fb.length} öneri</strong> geldi. En yeni öneri şu: “${esc(String(fb[0].props?.text || '').slice(0, 120))}”`);
  return out;
}

// The app's step order (OnboardingModel.steps). Steps in OPTIONAL are not shown to everyone: some depend on the answers
// (frequency, growling, safety, meal and outing times), the owner questions and the invite code came with 1.2.x, and
// "story" was dropped. The funnel counts everyone who got at least as far as a step, so the numbers only go down and the
// losses add up to the "nerede bırakıyorlar" list. Going back a step or reopening the app does not move anyone backwards.
const FLOW = ['welcome', 'name', 'photo', 'age', 'insightAge', 'breed', 'arrival', 'origin', 'home', 'household', 'problems',
  'frequency', 'redFlag', 'safety', 'insightMethod', 'goal', 'minutes', 'insightShort', 'meals', 'outings', 'routine', 'rewards',
  'microchip', 'ownerName', 'ownerPhoto', 'ownerGender', 'ownerAge', 'ownerIncome', 'ownerBudget', 'insightOwner', 'inviteCode',
  'story', 'building', 'summary', 'notifications'];
const OPTIONAL = new Set(['frequency', 'redFlag', 'safety', 'meals', 'outings', 'ownerName', 'ownerPhoto', 'ownerGender', 'ownerAge',
  'ownerIncome', 'ownerBudget', 'inviteCode', 'story']);

async function obEvents(b) {
  const all = [];
  for (let from = 0; from < 50000; from += 1000) {
    const { data, error } = await sb.from('events').select('install_id,name,props,created_at')
      .in('name', ['ob_step', 'ob_complete']).gte('created_at', b.p_from).lt('created_at', b.p_to)
      .order('created_at', { ascending: true }).range(from, from + 999);
    if (error) throw new Error(error.message);
    all.push(...data);
    if (data.length < 1000) break;
  }
  return all;
}

function onboarding(ev) {
  const pos = Object.fromEntries(FLOW.map((s, i) => [s, i]));
  const per = {};
  for (const e of ev) {
    const x = per[e.install_id] || (per[e.install_id] = { far: -1, done: false, seen: new Set(), seq: [] });
    const t = new Date(e.created_at).getTime();
    if (e.name === 'ob_complete') { x.done = true; x.seq.push(['__done', t]); continue; }
    const st = e.props?.step;
    if (!st) continue;
    x.seen.add(st); x.seq.push([st, t]);
    if ((pos[st] ?? -1) > x.far) x.far = pos[st] ?? x.far;
  }
  const people = Object.values(per);
  // time spent on a step: until the next step event of the same person, ignoring gaps over 30 minutes
  const secs = {};
  for (const x of people) for (let i = 0; i + 1 < x.seq.length; i++) {
    const d = (x.seq[i + 1][1] - x.seq[i][1]) / 1000;
    if (x.seq[i][0] !== '__done' && d >= 1 && d < 1800) (secs[x.seq[i][0]] ||= []).push(d);
  }
  const median = a => { if (!a?.length) return null; const v = [...a].sort((p, q) => p - q); return v[Math.floor(v.length / 2)]; };
  const got = i => people.filter(x => x.done || x.far >= i).length;
  const main = FLOW.filter(st => !OPTIONAL.has(st)).map(st => ({ step: st, reached: got(pos[st]), secs: median(secs[st]) }))
    .filter(r => r.reached > 0);
  const extra = FLOW.filter(st => OPTIONAL.has(st)).map(st => {
    const seen = people.filter(x => x.seen.has(st));
    return { step: st, seen: seen.length, passed: seen.filter(x => x.done || x.far > pos[st]).length, secs: median(secs[st]) };
  }).filter(r => r.seen > 0);
  const left = {};
  for (const x of people) if (!x.done) { const st = FLOW[x.far] || '?'; left[st] = (left[st] || 0) + 1; }
  const drop = Object.entries(left).map(([step, installs]) => ({ step, installs })).sort((a, b) => b.installs - a.installs);
  return { started: people.length, done: people.filter(x => x.done).length, main, extra, drop };
}

function funnelView(ob) {
  if (!ob.main.length) return `<h2>Onboarding hunisi</h2><div class="card muted">Henüz veri yok.</div>`;
  const top = ob.started || 1;
  let prev = null;
  const sec = v => v == null ? '' : v < 60 ? Math.round(v) + ' sn' : Math.round(v / 60) + ' dk';
  const lines = ob.main.map(r => {
    const lost = prev == null ? 0 : prev - r.reached;
    const d = prev ? Math.round(lost * 100 / prev) : 0;
    prev = r.reached;
    return `<div class="row"><div>${esc(STEP[r.step] || r.step)}</div><div class="track"><div class="fill" style="width:${r.reached * 100 / top}%"></div></div>
      <div style="text-align:right;font-variant-numeric:tabular-nums">${r.reached}</div>
      <div class="drop">${lost > 0 ? `−${lost} (%${d})` : ''} <span class="muted">${sec(r.secs)}</span></div></div>`;
  }).join('');
  const extra = ob.extra.map(r => `<div class="row"><div>${esc(STEP[r.step] || r.step)}</div><div class="track"><div class="fill" style="width:${r.seen * 100 / top}%;opacity:.45"></div></div>
      <div style="text-align:right;font-variant-numeric:tabular-nums">${r.seen}</div>
      <div class="ok">%${Math.round(r.passed * 100 / r.seen)} geçti <span class="muted">${sec(r.secs)}</span></div></div>`).join('');
  return `<h2>Onboarding hunisi <span class="muted" style="font:500 14px Geist">${ob.started} başlayan · ${ob.done} biten</span></h2>
    <div class="card funnel"><div class="row head"><div>Adım</div><div>Bu adıma gelen</div><div style="text-align:right">Kişi</div><div style="text-align:right">Kayıp · süre</div></div>${lines}
    ${extra ? `<div class="sub">Herkese sorulmayan adımlar (cevaba ya da sürüme göre çıkar). Sayı, adımı gören kişidir.</div>${extra}` : ''}</div>`;
}

function dropView(rows, ob) {
  // the furthest step of everyone who has not finished onboarding; adds up to the funnel's losses
  const total = rows.reduce((a, r) => a + r.installs, 0);
  const items = rows.length ? rows.map(r => `<div class="item"><span>${esc(STEP[r.step] || r.step)}</span><strong>${r.installs}</strong></div>`).join('') : '<p class="muted">Takılan yok.</p>';
  return `<h2>En çok nerede bırakıyorlar? <span class="muted" style="font:500 14px Geist">${total} kişi</span></h2><div class="card list">${items}
    <p class="muted" style="font-size:12px;margin:8px 0 0">Bitirmeyen herkesin gelebildiği en son adım. Toplam, hunideki kayıpların toplamına eşittir.</p></div>`;
}


function dailyView(rows) {
  if (!rows.length) return '';
  const max = Math.max(1, ...rows.map(r => Number(r.installs)));
  const total = rows.reduce((a, r) => a + Number(r.installs), 0);
  const bars = rows.map(r => `<div class="day" title="${r.day}: ${r.installs} kurulum">
      <div class="b" style="height:${Number(r.installs) * 100 / max}%;background:var(--bar)"></div>
      <div class="lbl">${r.day.slice(8, 10)}</div></div>`).join('');
  return `<h2>Günlük kurulum <span class="muted" style="font:500 14px Geist">${total} kurulum, günde ortalama ${(total / rows.length).toFixed(1)}</span></h2><div class="card"><div class="days">${bars}</div></div>`;
}


function statusPill(u) {
  const cls = u.purchased ? 'good' : u.purchase_taps > 0 ? 'warn' : u.paywall_views > 0 ? 'warn' : u.onboarding_done ? '' : 'bad';
  return `<span class="pill ${cls}">${esc(u.status)}</span>`;
}

// Per install from the usage events: owner name, last time the app was opened, walks, other entries, opened reminders.
function activity(usage) {
  const a = {};
  const get = id => a[id] || (a[id] = { last: null, opens: 0, walks: 0, logs: 0, notifs: 0, owner: null, feedback: 0, consent: null, ownerPhoto: null, seconds: 0, visits: 0, model: null });
  for (const e of usage) {
    const x = get(e.install_id);
    if (!x.model && e.device) x.model = e.device;
    if (e.name === 'app_open' || e.name === 'app_active' || e.name === 'ping') { if (e.name !== 'ping') x.opens++; if (!x.last || e.created_at > x.last) x.last = e.created_at; }
    else if (e.name === 'session_end') { x.seconds += Number(e.props?.seconds || 0); x.visits++; }
    else if (e.name === 'health_log') { e.props?.type === 'walk' ? x.walks++ : x.logs++; }
    else if (e.name === 'notif_open') x.notifs++;
    else if (e.name === 'owner_profile' && !x.owner) x.owner = e.props || {};
    else if (e.name === 'feedback') x.feedback++;
    else if (e.name === 'consent' && !x.consent) x.consent = e.props || {};
    else if (e.name === 'owner_photo' && !x.ownerPhoto) x.ownerPhoto = e.props?.path;
  }
  return a;
}

// KVKK: notice confirmed (required) and the two optional consents, latest answer first.
function consentPill(c) {
  if (!c) return '<span class="pill bad">Onay yok</span>';
  const yes = k => c[k] === 'yes';
  const label = yes('profile') ? 'Profil rızası' : 'Yalnız aydınlatma';
  return `<span class="pill ${yes('profile') ? 'good' : ''}" title="Aydınlatma okundu · profil: ${esc(c.profile || '-')} · sürüm ${esc(c.version || '')}">${label}</span>`;
}

function ago(d) {
  if (!d) return '–';
  const m = (Date.now() - new Date(d)) / 60000;
  return m < 60 ? Math.max(1, Math.round(m)) + ' dk önce' : m < 1440 ? Math.round(m / 60) + ' sa önce' : Math.round(m / 1440) + ' gün önce';
}

function usersView(users, usage = [], invites = []) {
  const inv = inviteStats(invites).byInstall;
  if (!users.length) return `<h2>Kullanıcılar</h2><div class="card muted">Bu aralıkta kurulum yok.</div>`;
  const act = activity(usage);
  const tr = users.map(u => { const x = act[u.install_id] || {}; const o = x.owner || {};
    const live = x.last && Date.now() - new Date(x.last) < 86400_000;
    return `<tr class="u" data-id="${u.install_id}">
      <td><span class="avatar" data-photo="${esc(u.photo_path || '')}">${esc((u.dog_name || '?').slice(0, 1).toUpperCase())}</span></td>
      <td><strong>${esc(u.dog_name || 'İsimsiz')}</strong><div class="muted" style="font-size:12px">${esc(ageLabel(u.dog_age))}</div></td>
      <td>${esc(o.owner_name || '–')}<div class="muted" style="font-size:12px">${esc([GENDER[o.gender], o.age].filter(v => v && v !== '–').join(' · '))}</div></td>
      <td><span class="pill ${live ? 'good' : ''}">${ago(x.last)}</span></td>
      <td>${x.opens || 0}</td>
      <td>${dur(x.seconds)}</td>
      <td class="muted" style="white-space:nowrap">${esc(phone(x.model || u.device))}</td>
      <td>${x.walks || 0}</td>
      <td>${x.logs || 0}</td>
      <td>${x.notifs || 0}</td>
      <td style="white-space:nowrap">${inviteCell(inv[u.install_id])}</td>
      <td>${consentPill(x.consent)}</td>
      <td>${u.onboarding_done ? '✓' : u.steps_done + ' adım'}</td>
      <td class="muted">${fmtDate(u.first_seen)}</td></tr>`; }).join('');
  return `<h2>Kullanıcılar <span class="muted" style="font:500 14px Geist">${users.length} kişi · satıra tıkla, tüm geçmişi gör</span></h2>
    <div class="card scroll"><table><tr><th></th><th>Köpek</th><th>Sahip</th><th>Son aktif</th><th>Açılış</th><th>Süre</th><th>Telefon</th><th>Yürüyüş</th><th>Diğer kayıt</th><th>Bildirim</th><th title="gönderim · tıklama · kurulum">Davet</th><th>KVKK</th><th>Onboarding</th><th>İlk açılış</th></tr>${tr}</table></div>`;
}

// Bildirim gönder: the send-push function (analytics/functions/send-push) delivers through Apple's push service.
// Only people who allowed notifications and use 1.2.0 or later have a push token.
function pushView(users, usage) {
  const tokens = new Set(usage.filter(e => e.name === 'push_token').map(e => e.install_id));
  const names = Object.fromEntries(users.map(u => [u.install_id, u.dog_name]));
  const opts = [...tokens].map(id => `<option value="${id}">${esc(names[id] || 'İsimsiz')} · ${id.slice(0, 8)}</option>`).join('');
  return `<h2>Bildirim gönder</h2>
    <div class="card push">
      <div class="row"><label>Kime</label><select id="pTarget"><option value="all">Bildirim izni veren herkes (${tokens.size} kişi)</option>${opts}</select></div>
      <div class="row"><label>Başlık</label><input id="pTitle" maxlength="60" placeholder="Örnek: {köpek} seni bekliyor"></div>
      <div class="row"><label>Mesaj</label><textarea id="pBody" maxlength="180" rows="3" placeholder="Örnek: Bugün 5 dakikalık bir {köpek} dersi yapalım mı?"></textarea></div>
      <p class="muted" style="font-size:12px;margin:4px 0 12px">{köpek} yerine köpeğin adı, {ad} yerine sahibinin adı yazılır. Bildirim yalnızca 1.2.0 ve sonrasını kullanan, bildirim izni veren kişilere gider.</p>
      <button class="btn" id="pSend">Gönder</button> <span id="pMsg" class="muted"></span>
    </div>`;
}

function bindPush() {
  const btn = document.getElementById('pSend'), msg = document.getElementById('pMsg');
  if (!btn) return;
  let armed = false;
  btn.onclick = async () => {
    const target = document.getElementById('pTarget').value;
    const title = document.getElementById('pTitle').value.trim(), body = document.getElementById('pBody').value.trim();
    if (!body) { msg.textContent = 'Önce mesajı yaz.'; return; }
    if (!armed) {
      const { data, error } = await sb.functions.invoke('send-push', { body: { title, body, target, dryRun: true } });
      if (error || data?.error) { msg.textContent = 'Hata: ' + (data?.error || error.message); return; }
      armed = true; btn.textContent = `${data.recipients} kişiye gönder`; msg.textContent = 'Emin misin? Tekrar bas.';
      return;
    }
    armed = false; btn.disabled = true; msg.textContent = 'Gönderiliyor…';
    const { data, error } = await sb.functions.invoke('send-push', { body: { title, body, target } });
    btn.disabled = false; btn.textContent = 'Gönder';
    if (error || data?.error) { msg.textContent = 'Hata: ' + (data?.error || error.message); return; }
    const why = Object.entries(data.reasons || {}).map(([k, v]) => `${k}: ${v}`).join(', ');
    msg.textContent = `${data.sent} kişiye gitti` + (data.failed ? `, ${data.failed} gitmedi (${why})` : '') + '.';
  };
  ['pTarget', 'pTitle', 'pBody'].forEach(id => document.getElementById(id).oninput = () => { armed = false; btn.textContent = 'Gönder'; msg.textContent = ''; });
}

async function signedUrl(path) {
  if (!path) return null;
  const { data } = await sb.storage.from('dog-photos').createSignedUrl(path, 3600);
  return data?.signedUrl || null;
}

async function fillPhotos(users) {
  const els = [...document.querySelectorAll('.avatar[data-photo]')].filter(e => e.dataset.photo);
  await Promise.all(els.map(async el => {
    const url = await signedUrl(el.dataset.photo);
    if (url) el.outerHTML = `<img class="avatar" src="${url}" alt="">`;
  }));
}

function describe(e) {
  const p = e.props || {};
  switch (e.name) {
    case 'app_open': return p.first === 'true' ? 'Uygulamayı ilk kez açtı' : 'Uygulamayı açtı';
    case 'ob_step': return `Onboarding: <strong>${esc(STEP[p.step] || p.step)}</strong> <span class="muted">(${Number(p.index) + 1}/${p.total})</span>`;
    case 'notif_result': return 'Bildirim izni: ' + ({ true: 'verdi', false: 'vermedi', skipped: '“Şimdi değil”' }[p.granted] || p.granted);
    case 'att_result': return 'Takip izni: ' + ({ authorized: 'verdi', denied: 'vermedi' }[p.status] || p.status);
    case 'ob_complete': return '<strong>Onboarding\'i bitirdi</strong>';
    case 'dog_profile': return `Köpek: <strong>${esc(p.name)}</strong> · ${esc(ageLabel(p.age))} · ${esc(p.breed)}${p.problems ? ' · ' + esc(p.problems) : ''}`;
    case 'dog_photo': return 'Profil fotoğrafı yükledi';
    case 'push_token': return 'Panel bildirimlerine açık';
    case 'tab_view': return 'Sekme: ' + esc(({ today: 'Bugün', plan: 'Plan', explore: 'Keşfet', health: 'Sağlık', assistant: 'Asistan' })[p.tab] || p.tab);
    case 'assistant_message': return 'Asistana soru sordu';
    case 'widget_state': return 'Widget: ' + (p.kinds === 'none' ? 'ekli değil' : esc(p.kinds));
    case 'widget_promo': return p.action === 'open' ? 'Widget ekleme adımlarını açtı' : 'Widget kartını kapattı';
    case 'satisfaction': return `<strong>Memnuniyet</strong>: ${esc(p.score)}/5`;
    case 'first_lesson_auto': return 'Onboarding bitince ilk dersi otomatik açıldı';
    case 'invite_share': return p.sent === 'yes' ? `<strong>Davet gönderdi</strong> · ${esc(p.channel)} <span class="muted">(kod ${esc(p.code)})</span>` : 'Davet ekranını açıp kapattı';
    case 'invite_redeem': return `<strong>Davet koduyla geldi</strong>: ${esc(p.code)}`;
    case 'session_end': return `Uygulamadan çıktı · ${dur(Number(p.seconds))} kaldı`;
    case 'ping': return 'Uygulamada';
    case 'paywall_view': return `<strong>Ödeme ekranını gördü</strong> <span class="muted">(${esc(p.variant)})</span>`;
    case 'paywall_plan': return 'Plan seçti: ' + (p.plan === 'monthly' ? 'aylık' : '3 aylık');
    case 'purchase_start': return 'Satın almaya bastı: ' + (p.plan === 'monthly' ? 'aylık' : '3 aylık');
    case 'purchase_result': return `<strong>Satın alma ${esc(RESULT[p.result] || p.result)}</strong>${p.error ? ' <span class="muted">' + esc(p.error) + '</span>' : ''}`;
    case 'restore_result': return 'Geri yükleme: ' + (p.success === 'true' ? 'başarılı' : 'abonelik yok');
    case 'paywall_leave': return `Ödeme ekranındayken uygulamadan çıktı <span class="muted">(${esc(p.seconds)} sn)</span>`;
    case 'survey_shown': return '“Neden şimdi değil?” sorusu gösterildi';
    case 'survey_answer': return 'Cevap: <strong>' + esc(SURVEY[p.answer] || p.answer) + '</strong>';
    case 'lesson_open': return 'Ders açtı: ' + esc(p.lesson);
    case 'app_active': return 'Uygulamaya döndü';
    case 'owner_profile': return `Sahip: <strong>${esc(p.owner_name || 'adsız')}</strong> · ${esc(GENDER[p.gender] || '')} ${esc(p.age || '')} · gelir ${esc(INCOME[p.income] || '–')} · bütçe ${esc(BUDGET[p.budget] || '–')}`;
    case 'feedback': return '<strong>Öneri:</strong> ' + (p.score ? `(${esc(p.score)}/5) ` : '') + esc(p.text);
    case 'health_log': return 'Kayıt: ' + esc(LOG[p.type] || p.type) + (p.minutes ? ` (${esc(p.minutes)} dk)` : '') + ` <span class="muted">${esc(p.source === 'widget' ? 'widget' : '')}</span>`;
    case 'notif_open': return 'Bildirime dokundu';
    case 'consent': return `<strong>KVKK</strong>: aydınlatma metnini okudu · profil rızası ${p.profile === 'yes' ? 'verdi' : 'vermedi'} <span class="muted">(sürüm ${esc(p.version)}, ${p.source === 'settings' ? 'Ayarlar' : 'kurulum'})</span>`;
    case 'owner_photo': return 'Kendi fotoğrafını yükledi';
    case 'lesson_complete': return 'Ders bitirdi: ' + esc(p.lesson) + ` <span class="muted">(${esc(p.count)}. ders)</span>`;
    default: return esc(e.name);
  }
}

async function openUser(u) {
  const drawer = document.getElementById('drawer');
  const panel = document.getElementById('drawerPanel');
  drawer.classList.add('open');
  panel.innerHTML = '<p class="muted">Yükleniyor…</p>';
  const [events, photo] = await Promise.all([rpc('panel_user_events', { p_install: u.install_id }), signedUrl(u.photo_path)]);
  const ownerPhoto = await signedUrl(events.find(e => e.name === 'owner_photo')?.props?.path);
  let day = '';
  const items = events.filter(e => e.name !== 'ping').map(e => {
    const d = new Date(e.created_at).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long' });
    const head = d !== day ? `<li style="display:block;border:0;padding-top:16px"><strong>${d}</strong></li>` : '';
    day = d;
    return head + `<li><span class="t">${fmtTime(e.created_at)}</span><span>${describe(e)}</span></li>`;
  }).join('');
  panel.innerHTML = `<button class="btn ghost" id="close">Kapat</button>
    <div style="display:flex;gap:16px;align-items:center;margin-top:16px">
      ${photo ? `<img class="big-photo" src="${photo}" alt="">` : `<span class="avatar" style="width:72px;height:72px;font-size:28px">${esc((u.dog_name || '?').slice(0, 1))}</span>`}
      <div><div style="font:400 30px/1.1 'Instrument Serif',serif">${esc(u.dog_name || 'İsimsiz')}</div>
        <div class="muted">${esc(ageLabel(u.dog_age))} ${u.dog_problems ? '· ' + esc(u.dog_problems) : ''}</div>
        <div style="margin-top:6px">${statusPill(u)}</div></div>
    </div>
    ${(() => { const o = events.find(e => e.name === 'owner_profile')?.props; return o ? `<p style="margin:12px 0 0">${ownerPhoto ? `<img class="avatar" src="${ownerPhoto}" alt="" style="vertical-align:middle;margin-right:8px">` : ''}Sahip: <strong>${esc(o.owner_name || 'adsız')}</strong> · ${esc(GENDER[o.gender] || '')} ${esc(o.age || '')} · gelir ${esc(INCOME[o.income] || '–')} · köpek bütçesi ${esc(BUDGET[o.budget] || '–')} TL</p>` : ''; })()}
    <p class="muted" style="font-size:12px">Destek kimliği: ${esc(u.install_id.slice(0, 8))} · ${esc(u.device || '')} · ${esc(u.app_version || '')}</p>
    <ul class="tl">${items}</ul>`;
  document.getElementById('close').onclick = () => drawer.classList.remove('open');
}
document.getElementById('drawer').onclick = e => { if (e.target.id === 'drawer') e.currentTarget.classList.remove('open'); };

sb.auth.onAuthStateChange((event) => { if (event === 'SIGNED_IN') start(); });
start();
</script>
